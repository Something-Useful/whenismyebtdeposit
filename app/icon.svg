<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Calendar body (saffron) -->
  <rect x="2" y="6" width="20" height="16" rx="3" fill="#f4a96b"/>
  <!-- Header bar (ink) -->
  <rect x="2" y="6" width="20" height="5.5" rx="3" fill="#1a1a1a"/>
  <rect x="2" y="9" width="20" height="2.5" fill="#1a1a1a"/>
  <!-- Top hangers -->
  <rect x="6" y="2" width="2.5" height="6" rx="1" fill="#1a1a1a"/>
  <rect x="15.5" y="2" width="2.5" height="6" rx="1" fill="#1a1a1a"/>
  <!-- Green deposit-day dot -->
  <circle cx="12" cy="16" r="4" fill="#77CB46"/>
</svg>
